services:
  - type: web
    name: horizon-search
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: HORIZON_HOST
        value: 0.0.0.0
      - key: HORIZON_REQUIRE_AUTH
        value: "true"
      - key: HORIZON_ENABLE_HSTS
        value: "true"
      - key: HORIZON_BASIC_AUTH_USER
        sync: false
      - key: HORIZON_BASIC_AUTH_PASSWORD
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
